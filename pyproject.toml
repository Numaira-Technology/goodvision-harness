[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "goodvision-harness"
version = "0.1.0"
description = "Independent WebRTC/WHEP video analysis and delivery harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
face = [
  "insightface==1.0.1",
  "onnxruntime>=1.20,<2",
]
face-gpu = [
  "insightface==1.0.1",
  "onnxruntime-gpu[cuda,cudnn]==1.26.0",
]
face-directml = [
  "insightface==1.0.1",
  "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
]
webrtc = [
  "aiohttp>=3.10,<4",
  "aiortc>=1.15,<2",
]

[project.scripts]
goodvision-harness = "goodvision_harness.service:main"
goodvision-harness-cli = "goodvision_harness.pipeline:main"
goodvision-harness-demo = "goodvision_harness.demo.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["goodvision_harness*"]

[tool.setuptools.package-data]
goodvision_harness = [
  "config.yaml",
  "dashboard.html",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
