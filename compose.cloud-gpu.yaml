# Local gateway plus an idle, UI-controlled cloud rental service.
name: goodvision-cloud

services:
  harness:
    extends:
      file: compose.analysis-gateway.yaml
      service: harness
    depends_on:
      sam-remote:
        condition: service_started
    environment:
      HARNESS_ANALYSIS_URL: http://sam-remote:8094
      CLOUD_GPU_CONTROLLER_URL: http://sam-remote:8093
  sam-remote:
    extends:
      file: compose.sam31-remote.yaml
      service: sam-remote

networks:
  default: {}
volumes:
  gateway-data: {}
  face-models:
    name: "${HARNESS_MODELS_VOLUME:-${COMPOSE_PROJECT_NAME:-goodvision-cloud}_face-models}"
  face-data: {}
  cloud-gpu-settings: {}
