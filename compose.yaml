name: goodvision-harness

services:
  harness:
    build:
      context: .
    image: goodvision-harness:demo
    init: true
    restart: unless-stopped
    ports:
      - "${HARNESS_BIND_ADDRESS:-127.0.0.1}:${HARNESS_PORT:-8080}:8080"
    environment:
      HARNESS_CONFIG: /app/config.yaml
      HARNESS_DEPLOYMENT_SETTINGS_PATH: /data/deployment-settings.json
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: 8080
      HARNESS_DRY_RUN: "${HARNESS_DRY_RUN:-false}"
      HARNESS_AUTOSTART: "${HARNESS_AUTOSTART:-true}"
      HARNESS_SOURCE_ID: "${HARNESS_SOURCE_ID:-external-camera}"
      # Primary generic stream setting; RTSP_URL remains a compatibility fallback.
      HARNESS_STREAM_URL: "${HARNESS_STREAM_URL:-}"
      RTSP_URL: "${RTSP_URL:-}"
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp|timeout;5000000}"
      INFERENCE_PROVIDER: "${INFERENCE_PROVIDER:-}"
      INFERENCE_MODEL: "${INFERENCE_MODEL:-}"
      INFERENCE_ENDPOINT: "${INFERENCE_ENDPOINT:-}"
      INFERENCE_API_KEY: "${INFERENCE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      RESULT_WEBHOOK_URL: "${RESULT_WEBHOOK_URL:-}"
      HARNESS_WEBHOOK_SECRET: "${HARNESS_WEBHOOK_SECRET:-}"
      FACE_MODEL_ROOT: /models
      FACE_GALLERY_PATH: /data/face-gallery.json
      FACE_PROVIDER: "${FACE_PROVIDER:-CPUExecutionProvider}"
      FACE_INFERENCE_INSTANCES: "${FACE_INFERENCE_INSTANCES:-2}"
      FACE_INFERENCE_THREADS: "${FACE_INFERENCE_THREADS:-2}"
      FACE_SAMPLE_FPS: "${FACE_SAMPLE_FPS:-}"
      SCENE_DIAGNOSTICS_ENABLED: "${SCENE_DIAGNOSTICS_ENABLED:-}"
      SCENE_MAX_IN_FLIGHT: "${SCENE_MAX_IN_FLIGHT:-4}"
      SCENE_OBSERVATION_FPS: "${SCENE_OBSERVATION_FPS:-1.25}"
      SCENE_MAX_IMAGE_SIDE: "${SCENE_MAX_IMAGE_SIDE:-720}"
      SCENE_JPEG_QUALITY: "${SCENE_JPEG_QUALITY:-90}"
      LOCAL_CAMERA_DISPLAY_ENABLED: "${LOCAL_CAMERA_DISPLAY_ENABLED:-false}"
      LOCAL_CAMERA_DISPLAY_DELAY_SECONDS: "${LOCAL_CAMERA_DISPLAY_DELAY_SECONDS:-6}"
      LOCAL_CAMERA_TARGET_FPS: "${LOCAL_CAMERA_TARGET_FPS:-20}"
      LOCAL_CAMERA_MOTION_WIDTH: "${LOCAL_CAMERA_MOTION_WIDTH:-160}"
      LOCAL_CAMERA_ANALYSIS_MAX_SIDE: "${LOCAL_CAMERA_ANALYSIS_MAX_SIDE:-720}"
      LOCAL_CAMERA_ANALYSIS_JPEG_QUALITY: "${LOCAL_CAMERA_ANALYSIS_JPEG_QUALITY:-80}"
      GOODVISION_SAM_SPOOL_DIRECTORY: /data/sam-spool
      # Empty values retain YAML defaults; realtime_latest requires explicit opt-in.
      PERCEPTION_METHOD: "${PERCEPTION_METHOD:-}"
      SAM31_QUEUE_POLICY: "${SAM31_QUEUE_POLICY:-}"
      SAM31_REALTIME_APPEND_FRAMES: "${SAM31_REALTIME_APPEND_FRAMES:-}"
      SAM31_REALTIME_PENDING_FRAMES: "${SAM31_REALTIME_PENDING_FRAMES:-}"
      SAM31_REALTIME_MAX_AGE_SECONDS: "${SAM31_REALTIME_MAX_AGE_SECONDS:-}"
      SAM31_RESULT_DEADLINE_SECONDS: "${SAM31_RESULT_DEADLINE_SECONDS:-}"
      RICH_LABEL_ENABLED: "${RICH_LABEL_ENABLED:-false}"
      RICH_LABEL_ENDPOINT: "${RICH_LABEL_ENDPOINT:-http://rich-label-worker:8091/v1/labels}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # Optional reference images configured under config.yaml memory.*.
      - ./memory:/app/memory:ro
      - face-models:/models
      - face-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Cover the 10s HTTP drain plus the 60s model timeout and cleanup headroom.
    stop_grace_period: 90s
    networks:
      default:
        aliases:
          - goodvision-harness

  rich-label-worker:
    profiles: ["rich"]
    build:
      context: ./workers/paddle_rich_label
    image: goodvision-rich-label-worker:demo-cpu
    init: true
    restart: unless-stopped
    environment:
      RICH_DEVICE: "${RICH_DEVICE:-cpu}"
      RICH_DETECTOR_MODEL: "${RICH_DETECTOR_MODEL:-PicoDet-S}"
      RICH_ATTRIBUTE_MODEL: "${RICH_ATTRIBUTE_MODEL:-PP-LCNet_x1_0_pedestrian_attribute}"
      RICH_DETECTION_THRESHOLD: "${RICH_DETECTION_THRESHOLD:-0.45}"
      RICH_TRACK_VISIBLE_IDLE_FRAMES: "${RICH_TRACK_VISIBLE_IDLE_FRAMES:-1}"
      RICH_ATTRIBUTE_INTERVAL_FRAMES: "${RICH_ATTRIBUTE_INTERVAL_FRAMES:-10}"
      RICH_ATTRIBUTE_RETRY_SECONDS: "${RICH_ATTRIBUTE_RETRY_SECONDS:-60}"
      RICH_ATTRIBUTE_SHUTDOWN_TIMEOUT_SECONDS: "${RICH_ATTRIBUTE_SHUTDOWN_TIMEOUT_SECONDS:-5}"
      RICH_DETECTOR_MODEL_DIR: "${RICH_DETECTOR_MODEL_DIR:-}"
      RICH_ATTRIBUTE_MODEL_DIR: "${RICH_ATTRIBUTE_MODEL_DIR:-}"
    volumes:
      - rich-models:/models
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: goodvision-demo

volumes:
  face-models:
  face-data:
  rich-models:
