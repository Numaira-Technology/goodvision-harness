name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux regression shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch pinned historical benchmark source objects
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          sources = json.loads(Path("tools/unified_benchmark/native_assets/sources.json").read_text())
          for commit in sorted({source["commit"] for source in sources.values()}):
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", commit], check=True)
          PY
      - name: Check repository hygiene
        run: python tools/check_repo_hygiene.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install ".[dev,webrtc,vlm]"
      - name: Install video encoder (Linux)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run regression suite (no models or service credentials)
        # Leave time to upload evidence before the unchanged 20-minute job limit.
        run: python tools/ci_regression.py run --shard ${{ matrix.shard }} --shards 2 --seconds 960 --output outputs/ci/linux-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-linux-${{ matrix.shard }}
          path: outputs/ci/linux-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  tests:
    # Keep the existing required Linux check name. A failed/cancelled shard or
    # incomplete collection must fail this gate, never become a successful skip.
    name: Tests (ubuntu-latest, Python 3.11)
    if: always()
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-linux-*
          path: outputs/ci-downloaded
      - name: Require all Linux tests and exact-once coverage
        env:
          LINUX_RESULT: ${{ needs.linux-tests.result }}
        run: python tools/ci_regression.py verify --shards 2 --result "$LINUX_RESULT" outputs/ci-downloaded

  windows-regressions:
    name: Windows regression shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Fetch pinned historical benchmark source objects
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          sources = json.loads(Path("tools/unified_benchmark/native_assets/sources.json").read_text())
          for commit in sorted({source["commit"] for source in sources.values()}):
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", commit], check=True)
          PY
      - name: Check repository hygiene
        run: python tools/check_repo_hygiene.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install ".[dev,webrtc,vlm]"
      - name: Install video encoder (Windows)
        run: choco install ffmpeg --no-progress -y
      - name: Run regression suite (no models or service credentials)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $evidence = "outputs/ci/windows-${{ matrix.shard }}"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          python -u -m pytest -vv -o faulthandler_timeout=60 --durations=20 -p tools.ci_pytest --ci-shard ${{ matrix.shard }} --ci-shards 2 --ci-evidence $evidence --junitxml="$evidence/junit.xml"
          $testExitCode = $LASTEXITCODE
          @{exit_code=$testExitCode; timed_out=$false} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$evidence/run.json"
          exit $testExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-windows-${{ matrix.shard }}
          path: outputs/ci/windows-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  windows-tests:
    # Preserve the existing required name and reject missing/failed execution.
    name: Tests (windows-latest, Python 3.12)
    if: always()
    needs: windows-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: regression-windows-*
          path: outputs/ci-windows-downloaded
      - name: Require all Windows tests and exact-once coverage
        env:
          WINDOWS_RESULT: ${{ needs.windows-regressions.result }}
        run: python tools/ci_regression.py verify --shards 2 --result "$WINDOWS_RESULT" outputs/ci-windows-downloaded

  sam3-onnx-contract:
    name: Optional SAM3 ONNX contract (no weights)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned optional adapter
        run: python -m pip install '.[dev,sam3-onnx]'
      - name: Check offline adapter and worker contracts
        run: python -m pytest tests/test_sam3_onnx.py tests/test_sam3_onnx_package.py workers/detector_rich_label/test_contract.py

  preview-browser:
    name: Preview layouts and live recordings (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/vlm_benchmark/monitor-requirements.txt
      - name: Install offline preview test dependencies
        run: |
          python -m pip install ".[dev,video,vlm]" -r tools/vlm_benchmark/monitor-requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify three modes, layouts, tracking and complete recordings
        env:
          VLM_MONITOR_BROWSER_TESTS: '1'
          VLM_TRACKING_REVIEW_OUTPUT: outputs/preview-browser/tracking
        run: |
          mkdir -p outputs/preview-browser
          python -m pytest tests/test_vlm_monitor.py tests/test_vlm_preview_tracking.py tests/test_tracked_grounding_browser.py --basetemp=outputs/preview-browser/tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-browser-evidence
          path: |
            outputs/preview-browser/**/*.png
            outputs/preview-browser/**/*.json
            outputs/preview-browser/**/viewport.mp4
          if-no-files-found: warn

  gateway-video-integration:
    name: Two-route WHEP gateway (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment gateway image
        run: docker build --target analysis-gateway -t goodvision-analysis-gateway:verification .
      - name: Prepare the private relay key with controller permissions
        run: |
          docker volume create gateway-relay-auth-${{ github.run_id }}-${{ github.run_attempt }}
          docker run --rm --network none --read-only --user 0:0 \
            --tmpfs /tmp:size=16m --security-opt no-new-privileges:true \
            --volume gateway-relay-auth-${{ github.run_id }}-${{ github.run_attempt }}:/relay-auth \
            --volume "$PWD/tools/relay_bootstrap.py:/verification/relay_bootstrap.py:ro" \
            goodvision-analysis-gateway:verification \
            python -c 'import runpy; from pathlib import Path; f = runpy.run_path("/verification/relay_bootstrap.py")["controller_environment"]; env = {"SAM_ANALYSIS_ENABLED": "true", "HARNESS_RELAY_KEY": "", "HARNESS_RELAY_KEY_FILE": "/relay-auth/key"}; first = f(env, Path("/tmp/controller")); second = f(env, Path("/tmp/controller")); assert first["HARNESS_RELAY_KEY"] == second["HARNESS_RELAY_KEY"]; assert len(first["HARNESS_RELAY_KEY"]) == 64'
      - name: Verify authenticated offline WHEP relays with deployment memory limits
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=64m --shm-size=192m \
            --security-opt no-new-privileges:true \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env HARNESS_RELAY_KEY_FILE=/relay-auth/key \
            --volume gateway-relay-auth-${{ github.run_id }}-${{ github.run_attempt }}:/relay-auth:ro \
            --volume "$PWD/tests/gateway_whep_container.py:/verification/gateway_whep_container.py:ro" \
            goodvision-analysis-gateway:verification \
            python /verification/gateway_whep_container.py
      - name: Remove the verification relay key volume
        if: always()
        run: docker volume rm gateway-relay-auth-${{ github.run_id }}-${{ github.run_attempt }}
