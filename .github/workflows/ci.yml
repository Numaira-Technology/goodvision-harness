name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            timeout_minutes: 15
          - os: windows-latest
            python: '3.12'
            timeout_minutes: 25
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check repository hygiene
        run: python tools/check_repo_hygiene.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install ".[dev,webrtc,vlm]"
      - name: Install video encoder (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install video encoder (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Run regression suite (no models or service credentials)
        run: python -m pytest -q

  gateway-video-integration:
    name: Two-route WHEP gateway (Linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployment gateway image
        run: docker build --target analysis-gateway -t goodvision-analysis-gateway:verification .
      - name: Verify real offline WHEP relays with deployment memory limits
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=64m --shm-size=192m \
            --security-opt no-new-privileges:true \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$PWD/tests/gateway_whep_container.py:/verification/gateway_whep_container.py:ro" \
            goodvision-analysis-gateway:verification \
            python /verification/gateway_whep_container.py
