name: Windows customer updater

on:
  pull_request:
    paths:
      - 'tools/customer_*.py'
      - 'tools/update_docker.py'
      - 'tools/package_customer_docker_update.py'
      - 'tools/harness_update/*.py'
      - 'tests/test_customer_*.py'
      - '.github/workflows/customer-updater.yml'
  push:
    branches: [main]
    paths:
      - 'tools/customer_*.py'
      - 'tools/update_docker.py'
      - 'tools/package_customer_docker_update.py'
      - 'tools/harness_update/*.py'
      - '.github/workflows/customer-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install pyinstaller pytest
      - name: Test customer updater
        run: python -m pytest -o addopts= -q tests/test_customer_docker_update.py tests/test_customer_runtime.py tests/test_customer_update_manual.py tests/test_customer_update_manual_gui.py tests/test_docker_update.py
      - name: Build standalone updater
        run: python -c "from pathlib import Path; from tools.package_customer_docker_update import build_executable; build_executable(Path('dist/windows-updater'))"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-updater-${{ github.sha }}
          path: dist/windows-updater/Update.exe
          if-no-files-found: error
          retention-days: 30
