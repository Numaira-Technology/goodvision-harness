name: goodvision-harness

services:
  harness:
    image: goodvision-harness:2026.08.28-face-distance.1
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${HARNESS_BIND_ADDRESS:-127.0.0.1}:${HARNESS_PORT:-8080}:8080"
    environment:
      HARNESS_CONFIG: /app/config.yaml
      HARNESS_DEPLOYMENT_SETTINGS_PATH: /data/deployment-settings.json
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: 8080
      # Defaults to the robot LAN WHEP endpoint baked into the image.
      # A non-empty .env value overrides it; RTSP_URL is a legacy fallback.
      HARNESS_STREAM_URL: "${HARNESS_STREAM_URL:-}"
      RTSP_URL: "${RTSP_URL:-}"
      # Safe first boot. Values saved in the console become authoritative.
      HARNESS_DRY_RUN: "true"
      HARNESS_AUTOSTART: "true"
      HARNESS_SOURCE_ID: "${HARNESS_SOURCE_ID:-external-camera}"
      OPENCV_FFMPEG_CAPTURE_OPTIONS: "${OPENCV_FFMPEG_CAPTURE_OPTIONS:-rtsp_transport;tcp|timeout;5000000}"
      AICLUB_API_KEY: "${AICLUB_API_KEY:-}"
      RESULT_WEBHOOK_URL: "${RESULT_WEBHOOK_URL:-}"
      HARNESS_WEBHOOK_SECRET: "${HARNESS_WEBHOOK_SECRET:-}"
      FACE_MODEL_ROOT: /models
      FACE_GALLERY_PATH: /data/face-gallery.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - face-models:/models
      - face-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 90s

volumes:
  face-models:
  face-data:
