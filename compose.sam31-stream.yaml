# Experimental persistent native memory, on top of the bounded SAM3.1 deployment.
# docker compose -f compose.yaml -f compose.sam31.yaml -f compose.sam31-stream.yaml up --build -d
services:
  harness:
    environment:
      RICH_LABEL_BACKEND: sam31_stream
      RICH_LABEL_ENDPOINT: http://sam31-worker:8092/v1/video/sessions
      SAM31_BATCH_FRAMES: "16"
  sam31-worker:
    environment:
      SAM31_SESSION_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health/video/session', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 180s
      retries: 4
