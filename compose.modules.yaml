# Independent modules: no harness service or production volumes are replaced.
name: goodvision-modules
services:
  bbox:
    profiles: [bbox]
    image: goodvision-bbox:0.1.0
    build:
      context: .
      dockerfile: workers/bbox/Dockerfile
    init: true
    restart: unless-stopped
    ports: ["${MODULE_BIND_ADDRESS:-127.0.0.1}:${BBOX_PORT:-8096}:8096"]
    volumes: ["bbox-models:/models", "bbox-data:/data"]
    environment:
      DETECTOR_DEVICE: cuda
      DETECTOR_WEIGHTS: /models/yolo26s.pt
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${MODULE_GPU_ID:-0}"], capabilities: [gpu]}]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8096/health/tracking',timeout=3)); assert r['ready'] and r['gpu_ready'] and r['model']=='yolo26-s'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
    logging:
      options: {max-size: "10m", max-file: "3"}
  system1:
    profiles: [system1]
    image: goodvision-system1:0.1.0
    build:
      context: .
      dockerfile: workers/system1/Dockerfile
    init: true
    restart: unless-stopped
    ports: ["${MODULE_BIND_ADDRESS:-127.0.0.1}:${SYSTEM1_PORT:-8097}:8097"]
    volumes: ["system1-models:/models", "system1-data:/data"]
    shm_size: 2g
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ["${MODULE_GPU_ID:-0}"], capabilities: [gpu]}]
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8097/health',timeout=3)); assert r['ready'] and r['model']=='ZhuYuhan/VideoJev-4B'"]
      interval: 15s
      timeout: 5s
      start_period: 600s
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  bbox-models:
  bbox-data:
  system1-models:
  system1-data:
