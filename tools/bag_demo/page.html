<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻包检测 Demo · VideoJev + YOLO</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#161b22; --line:#2b3340;
          --red:#ff5a52; --amber:#ffb020; --green:#39d98a; --gray:#8b949e; --cyan:#4cc9f0; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font: 15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:#e6edf3; overflow:hidden;
         display:flex; flex-direction:column; }
  header { padding:10px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:12px; flex-wrap:wrap; flex:0 0 auto; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--gray); font-size:12px; }
  #clips { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; max-width:62%; justify-content:flex-end; }
  #clips button { background:var(--panel); color:#e6edf3; border:1px solid var(--line);
                  border-radius:7px; padding:4px 9px; cursor:pointer; font-size:12px; }
  #clips button.active { border-color:var(--cyan); color:var(--cyan); }
  main { flex:1 1 auto; min-height:0; display:flex; gap:18px; padding:16px 20px;
         align-items:center; justify-content:center; }
  .left { display:flex; flex-direction:column; align-items:center; gap:8px; min-height:0; }
  .right { width:330px; flex:0 0 330px; }
  .stage { position:relative; background:#000; border-radius:12px; overflow:hidden;
           border:1px solid var(--line); display:flex; }
  video { display:block; max-height:72vh; max-width:52vw; width:auto; height:auto; }
  canvas#ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:16px; margin-bottom:14px; }
  .verdict { text-align:center; padding:22px 12px; }
  .verdict .big { font-size:34px; font-weight:700; letter-spacing:1px; }
  .verdict .state { color:var(--gray); font-size:13px; margin-top:6px; min-height:18px; }
  .bar { margin:10px 0; }
  .bar .k { display:flex; justify-content:space-between; font-size:13px; color:var(--gray); }
  .bar .track { height:8px; background:#0b0f14; border-radius:6px; overflow:hidden; margin-top:4px; }
  .bar .fill { height:100%; width:0; transition:width .3s; }
  .log { font:12px/1.5 ui-monospace,Menlo,monospace; color:var(--gray);
         max-height:220px; overflow:auto; white-space:pre-wrap; }
  .legend { font-size:12px; color:var(--gray); display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
  .selfcheck { font-size:12px; color:var(--gray); }
  .selfcheck.ok { color:var(--green); } .selfcheck.bad { color:var(--red); }
  label.toggle { font-size:12px; color:var(--gray); cursor:pointer; user-select:none; }
</style>
</head>
<body>
<header>
  <h1>翻包检测 Demo</h1>
  <span class="sub">实验 Demo · VideoJev 刀/武器候选 · 酒类 VLM 未接入</span>
  <div id="clips"></div>
</header>

<main>
  <div class="left">
    <div class="stage">
      <video id="vid" playsinline controls></video>
      <canvas id="ov"></canvas>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--red)"></span>物体候选框（刀/瓶，非违禁判定）</span>
      <span><span class="dot" style="background:var(--cyan)"></span>包/其他</span>
      <label class="toggle"><input type="checkbox" id="chkTruth"> 显示人工标注对照（自检）</label>
    </div>
  </div>

  <div class="right">
    <div class="panel verdict">
      <div class="big" id="label">—</div>
      <div class="state" id="state">选择一段视频开始</div>
      <div class="selfcheck" id="selfcheck"></div>
    </div>
    <div class="panel">
      <div class="sub">酒类未判定 · 分数未经校准 · 非安全放行依据</div>
      <div class="bar"><div class="k"><span>刀 / 武器</span><span id="knifeP">–</span></div>
        <div class="track"><div class="fill" id="knifeFill" style="background:var(--red)"></div></div></div>
      <div class="bar"><div class="k"><span>VideoJev 酒瓶实验分数（非 VLM 判定）</span><span id="alcoholP">–</span></div>
        <div class="track"><div class="fill" id="alcoholFill" style="background:var(--amber)"></div></div></div>
    </div>
    <div class="panel"><div class="log" id="log"></div></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const vid = $('#vid'), ov = $('#ov'), ctx = ov.getContext('2d');
let CLIPS = [], current = null, boxes = null;
let sticky = {knife:false, alcohol:false}, lastTruth = null, lastScoreT = -99, generation = 0;
let scoreRequest = null, boxRequest = null;

function requestJSON(url, timeoutMs) {
  const controller = new AbortController();
  let rejectCancelled;
  const cancelled = new Promise((_, reject) => { rejectCancelled = reject; });
  const cancel = () => {
    // Settle our wait even if the transport/body reader ignores abort.
    rejectCancelled(new Error('request cancelled or timed out'));
    controller.abort();
  };
  const timer = setTimeout(cancel, timeoutMs);
  const result = (async () => {
    const response = await fetch(url, {signal:controller.signal});
    if (!response.ok) throw new Error('request unavailable');
    return await response.json();
  })();
  return {cancel, promise:Promise.race([result, cancelled]).finally(() => clearTimeout(timer))};
}

function cancelScore() {
  const previous = scoreRequest;
  scoreRequest = null; // detach before its catch/finally can run
  if (previous) previous.cancel();
}
function cancelBoxes() {
  const previous = boxRequest;
  boxRequest = null;
  if (previous) previous.cancel();
}

async function loadClips() {
  const r = await (await fetch('/api/clips')).json();
  CLIPS = r.clips;
  const box = $('#clips'); box.innerHTML = '';
  if (!CLIPS.length) { box.innerHTML = '<span class="sub">demo-media/bag 下暂无视频</span>'; return; }
  CLIPS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.name.replace(/\.MOV$/i,'');
    b.onclick = () => selectClip(c);
    b.dataset.name = c.name; box.appendChild(b);
  });
  selectClip(CLIPS[0]);
}

async function selectClip(c) {
  ++generation;
  cancelScore(); cancelBoxes();
  current = c; lastTruth = c.truth;
  document.querySelectorAll('#clips button').forEach(b =>
    b.classList.toggle('active', b.dataset.name === c.name));
  sticky = {knife:false, alcohol:false}; lastScoreT = -99;
  setLabel('—','准备中…'); setBar('knife', null); setBar('alcohol', null);
  $('#log').textContent = ''; $('#selfcheck').textContent = '';
  vid.src = '/media/' + encodeURIComponent(c.name);
  boxes = null;
  vid.load();
  showTruth();
  const request = requestJSON('/api/boxes/' + encodeURIComponent(c.name), 10000);
  boxRequest = request;
  try {
    const data = await request.promise;
    // Object identity of the clip is insufficient when the user reselects it.
    if (boxRequest === request) boxes = data;
  } catch(e) {
    if (boxRequest === request) log('物体框不可用');
  } finally {
    if (boxRequest === request) boxRequest = null;
  }
}

function setLabel(text, state) {
  $('#label').textContent = text; $('#state').textContent = state || '';
  const color = text === '刀/武器候选' ? 'var(--red)' : text.includes('酒瓶') ? 'var(--amber)'
              : text === '未检出刀/武器' ? 'var(--cyan)' : text === '存疑' ? 'var(--gray)' : '#e6edf3';
  $('#label').style.color = color;
}
function setBar(kind, p) {
  p = Number.isFinite(p) && p >= 0 && p <= 1 ? p : null;
  const pct = p == null ? 0 : Math.round(p*100);
  $('#'+kind+'Fill').style.width = pct + '%';
  $('#'+kind+'P').textContent = p == null ? '–' : pct + '%';
}

// --- YOLO box overlay synced to playback ---
function nearestBoxes(t) {
  if (!boxes || !boxes.frames || !boxes.frames.length) return [];
  let best = boxes.frames[0], bd = 1e9;
  for (const f of boxes.frames) { const d = Math.abs(f.t - t); if (d < bd) { bd = d; best = f; } }
  return bd <= 0.4 ? best.boxes : [];
}
function drawOverlay() {
  const w = vid.clientWidth, h = vid.clientHeight;
  if (ov.width !== w || ov.height !== h) { ov.width = w; ov.height = h; }
  ctx.clearRect(0,0,w,h);
  for (const b of nearestBoxes(vid.currentTime)) {
    const [x1,y1,x2,y2] = b.xyxy;
    const px=x1*w, py=y1*h, pw=(x2-x1)*w, ph=(y2-y1)*h;
    ctx.lineWidth = b.alert ? 3 : 2;
    ctx.strokeStyle = b.alert ? '#ff5a52' : '#4cc9f0';
    ctx.strokeRect(px,py,pw,ph);
    const tag = b.cls + ' ' + Math.round(b.conf*100) + '%';
    ctx.font = '13px sans-serif';
    const tw = ctx.measureText(tag).width + 8;
    ctx.fillStyle = b.alert ? '#ff5a52' : '#4cc9f0';
    ctx.fillRect(px, Math.max(0,py-18), tw, 18);
    ctx.fillStyle = '#0e1116'; ctx.fillText(tag, px+4, Math.max(12,py-5));
  }
  requestAnimationFrame(drawOverlay);
}
requestAnimationFrame(drawOverlay);

// --- live VideoJev scoring as the clip plays ---
async function scoreTick() {
  if (!current || vid.paused || vid.ended || scoreRequest) return;
  if (vid.currentTime - lastScoreT < 1.2) return;   // don't outrun the scorer
  lastScoreT = vid.currentTime;
  const t = vid.currentTime, selected = generation, clip = current.name;
  $('#state').textContent = '评分中… t=' + t.toFixed(1) + 's';
  const request = requestJSON(`/api/verdict?clip=${encodeURIComponent(clip)}&t=${t.toFixed(6)}`, 60000);
  scoreRequest = request;
  try {
    const r = await request.promise;
    if (scoreRequest !== request || selected !== generation) return;
    if (r.error) throw new Error('scoring unavailable');
    if (r.clip !== clip || Math.abs(r.t - t) > 0.00001) throw new Error('response mismatch');
    applyVerdict(r, t);
  } catch(e) {
    if (scoreRequest === request && selected === generation) {
      setLabel('存疑', '当前评分不可用（检查本地采样 / GPU 隧道 :8093）');
      setBar('knife', null); setBar('alcohol', null);
    }
  } finally {
    // An abandoned request must never release a replacement request's slot.
    if (scoreRequest === request) scoreRequest = null;
  }
}

function applyVerdict(r, t) {
  if (r.knife_present) sticky.knife = true;        // gated weapon/knife decision (>=0.95)
  if (r.alcohol === true) sticky.alcohol = true;  // tracked for the experimental bar / self-check only
  const weaponScores = [r.knife_p, r.weapon_native_p].filter(Number.isFinite);
  setBar('knife', weaponScores.length ? Math.max(...weaponScores) : null);
  setBar('alcohol', r.alcohol_p);
  const label = sticky.knife ? '刀/武器候选' : r.label;
  const ms = r.timings && r.timings.model_pipeline_seconds;
  setLabel(label, 't=' + t.toFixed(1) + 's · 窗口判别=' + fmtV(r) + (Number.isFinite(ms) ? ` · ${ms.toFixed(1)}s` : ''));
  log(`t=${t.toFixed(1)}  knife=${fmt(r.knife)}(${pc(r.knife_p)}) alcohol=${fmt(r.alcohol)}(${pc(r.alcohol_p)}) weaponNative=${fmt(r.weapon_native)}`);
  showTruth();
}
function showTruth() {
  const sc = $('#selfcheck');
  sc.className = 'selfcheck';
  sc.textContent = $('#chkTruth').checked && lastTruth
    ? `样本人工标注（非本窗口真值）：刀${lastTruth.knife?'有':'无'} · 酒瓶${lastTruth.alcohol?'有':'无'}` : '';
}
const fmt = v => v === true ? 'yes' : v === false ? 'no' : '?';
const fmtV = r => `刀${fmt(r.knife)}/瓶${fmt(r.alcohol)}`;
const pc = p => p == null ? '–' : Math.round(p*100) + '%';
function log(line) { const el = $('#log'); el.textContent = (el.textContent + line + '\n').split('\n').slice(-101).join('\n'); el.scrollTop = el.scrollHeight; }

vid.addEventListener('timeupdate', scoreTick);
vid.addEventListener('seeking', () => {
  generation++; sticky = {knife:false, alcohol:false}; lastScoreT = -99;
  cancelScore();
  setLabel('—', '已跳转，等待新窗口'); setBar('knife', null); setBar('alcohol', null);
  $('#log').textContent = '';
});
window.addEventListener('pagehide', () => {
  generation++; cancelScore(); cancelBoxes();
});
$('#chkTruth').addEventListener('change', showTruth);
loadClips().catch(() => setLabel('存疑', '无法加载视频列表'));
</script>
</body>
</html>
