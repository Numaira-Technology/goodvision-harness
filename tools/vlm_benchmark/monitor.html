<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness · VLM 实时测试监看</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC",sans-serif;color:#edf2f8;background:#0c1420;font-size:14px}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:22px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}
h1{font-size:25px;margin:0 0 5px;font-weight:650;letter-spacing:-.5px}.muted{color:#9daec3}#model{font-size:14px}#badge{padding:10px 16px;border:1px solid #7188a0;border-radius:7px;font-weight:650;color:#ffd68b}
#toolbar{display:flex;justify-content:space-between;align-items:center;margin:17px 0 12px;gap:16px}#stage{font-size:16px;font-weight:600}#clock{color:#a4d6f2;font-variant-numeric:tabular-nums}
#metrics{display:flex;gap:12px;margin-bottom:14px}.metric{border:1px solid #314055;background:#172232;border-radius:8px;padding:9px 14px;min-width:270px}.metric strong{font-size:18px;margin:0 9px}.metric .label{color:#adc1d8}
#notice{font-size:12px;color:#c6d3e3;margin:0 0 13px}#grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px}
.camera{background:#162231;border:1px solid #304155;border-radius:9px;padding:10px;overflow:hidden}.camera-head{display:flex;justify-content:space-between;margin-bottom:7px;gap:6px;font-size:12px}.camera-head strong{font-size:14px}.source-clock{color:#b1d8ec;font-variant-numeric:tabular-nums}
.framepair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.frame-label{color:#aebed1;font-size:11px;margin-bottom:4px}
.screen{position:relative;background:#050b13;aspect-ratio:16/9;overflow:hidden;border-radius:5px}.screen video,.screen img,.screen canvas{display:block;width:100%;height:100%;object-fit:contain}.screen .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#95a5b9;pointer-events:none;text-align:center;padding:10px}
.evidence-note{color:#a8bad1;font-size:11px;height:16px;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lane{display:grid;grid-template-columns:52px 1fr;gap:4px;align-items:center;margin:4px 0}.lane-name{font-size:11px;font-weight:600;color:#accce7}.chips{display:flex;gap:3px}.chip{flex:1;text-align:center;white-space:nowrap;font-size:10px;padding:4px 2px;background:#24344a;color:#a8b9ce;border-radius:3px}.positive{background:#683c36;color:#ffdad3}.negative{background:#193e39;color:#b0e6d2}.uncertain{background:#53472e;color:#ffe0a0}.failed{background:#254a69;color:#d1edff}
.lane-time{grid-column:2;color:#95aac1;font-size:10px;white-space:nowrap;overflow:hidden}.camera-foot{border-top:1px solid #2b3c50;padding-top:5px;margin-top:6px;color:#829ab4;font-size:10px}#footer{font-size:12px;color:#91a9c3;margin-top:14px}#connection{color:#ffb7ad;margin-left:14px}#summary{margin-top:14px;padding:12px 16px;background:#193e39;border:1px solid #396c60;border-radius:7px}#summary[hidden]{display:none}body.compact{padding:15px 22px}body.compact #metrics{margin-bottom:10px}body.compact #notice{margin-bottom:9px}body.compact #toolbar{margin-top:12px}body.compact .camera{padding:8px}body.compact .camera-head{margin-bottom:4px}body.compact .lane{margin:2px 0}body.compact #grid{gap:9px}
body.multicam .screen{aspect-ratio:auto;height:145px}body.compact .screen{height:94px}body.compact .chip{padding:2px 1px}body.compact .lane{row-gap:1px}body.compact .lane-time{line-height:11px}body.compact .evidence-note{margin:3px 0}body.compact .camera-foot{padding-top:3px;margin-top:3px}
.tracking-note{color:#91d5ff;font-size:11px;min-height:16px}.evidence-detail{font-size:11px;color:#9daec3}.evidence-detail .screen{max-width:320px;height:160px}
.screen .tracking-overlay{position:absolute;inset:0;pointer-events:none}
.detector-evidence{position:absolute;right:3px;bottom:3px;width:46%;border:1px solid #ffd68b;background:#050b13;pointer-events:none}
.screen .detector-evidence canvas{width:100%;height:auto;aspect-ratio:16/9}
.detector-evidence-note{font-size:9px;line-height:12px;color:#ffd68b;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact.tracking-preview .screen{height:70px}
body.single-video .framepair{grid-template-columns:1fr}
body.single-video.compact .screen{height:125px}
body.single-video.compact.parallel-mode .screen{height:110px}
body.single-video.compact .evidence-note{display:none}
</style></head><body>
<header><div><h1>Harness / VLM 实时测试监看</h1><div id="model" class="muted">等待测试开始</div></div><div id="badge">准备中</div></header>
<div id="toolbar"><div id="stage">正在连接测试</div><div id="clock">00:00</div></div>
<div id="metrics"></div><div id="notice"></div><main id="grid"></main>
<div id="summary" hidden></div>
<div id="footer"><span id="display-note">等待视频</span><span id="connection"></span></div>
<script src="preview_tracking.js"></script><script src="monitor.js"></script></body></html>
