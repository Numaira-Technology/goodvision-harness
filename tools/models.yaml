# Model registry for the R2 fixed store (bucket: goodvision-models).
#
# One entry per model, with the two keys that let a rented GPU come up without
# building anything:
#
#   weights  -- where the pinned weights live in R2 (pulled by tools/model_source.py)
#   env      -- where a pre-built, conda-pack'd Python environment lives in R2
#               (pulled by tools/env_source.py; eval/serve exec {unpack_to}/bin/python)
#
# The env tarball is built ONCE per (model x GPU family) with tools/build_env.py
# -- it already contains torch, flash-attn and every dep compiled for that GPU,
# so a fresh rent just downloads it (egress-free) and launches
# `{unpack_to}/bin/python` (never PATH python/python3 or `conda activate`).
# No apt, no pip, no flash-attn compile on the box.
#
# Credentials (R2_ENDPOINT / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)
# come from the environment, never from this file. See docs/guides/model-storage-r2.md.

version: 1

defaults:
  bucket: goodvision-models

models:
  videojev:
    repo: ZhuYuhan/VideoJev-4B
    revision: 1c1a253bf90dfa66176124d25a48ffb791d517d5
    # key 1 -- weights (existing layout: models/<repo>/<revision>/)
    weights:
      r2_prefix: models/ZhuYuhan/VideoJev-4B/1c1a253bf90dfa66176124d25a48ffb791d517d5/
    # key 2 -- a pre-built environment; eval launches {unpack_to}/bin/python
    env:
      # Existing immutable artifact: do not overwrite it when rebuilding.
      # build_env prints new envs/videojev/<sha256> keys for manual pin review.
      # The remote manifest must agree with every restore field below.
      r2_key: envs/videojev/cu128-py312-torch280-ada.tar.gz
      manifest_key: envs/videojev/cu128-py312-torch280-ada.json
      sha256: 44ac889e4c3a23803099a46c76b9917ecd8c30a7b1bb391031d7b95a572cf594
      size: 4846542699                      # 4.85 GB conda-pack tarball
      unpack_to: /opt/env/videojev          # fixed prefix; built here, restored here
      activate_rel: bin/activate            # conda-pack identity; eval uses bin/python
      compat:                               # checked before download/execution
        python: "3.12"
        cuda: "12.8"
        torch: "2.8.0"
        gpu_family: ada                     # sm_89 -- RTX 4090; flash-attn built for this

  clip:
    repo: openai/clip-vit-large-patch14
    revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
    weights:
      r2_prefix: models/openai/clip-vit-large-patch14/32bd64288804d66eefd0ccbe215aa642df71cc41/
    env:
      r2_key: envs/clip/cu128-py312-torch280-ada.tar.gz
      manifest_key: envs/clip/cu128-py312-torch280-ada.json
      sha256: 7920dbee3e4f271434936e887ad39ab05bdb760c2f31adf8fdaac6ee864b06fa
      size: 4337329870                       # 4.34 GB conda-pack tarball
      unpack_to: /opt/env/clip
      activate_rel: bin/activate
      build:
        flash_attn: false                    # CLIP ViT -- skip the flash-attn compile
      compat:
        python: "3.12"
        cuda: "12.8"
        torch: "2.8.0"
        gpu_family: ada

  siglip2:
    repo: google/siglip2-base-patch16-224
    revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
    weights:
      r2_prefix: models/google/siglip2-base-patch16-224/75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2/
    env:
      r2_key: envs/siglip2/cu128-py312-torch280-ada.tar.gz
      manifest_key: envs/siglip2/cu128-py312-torch280-ada.json
      sha256: 05bf783fbd2aa108a2b0939291b9861d74ce364162f15df42486314261c73227
      size: 4136202534                       # 4.14 GB conda-pack tarball
      unpack_to: /opt/env/siglip2
      activate_rel: bin/activate
      build:
        flash_attn: false                    # SigLIP2 ViT -- skip the flash-attn compile
      compat:
        python: "3.12"
        cuda: "12.8"
        torch: "2.8.0"
        gpu_family: ada

  d3-nano:
    repo: vllm-sr/d3-nano
    revision: 462efc366229ea268cf4eed3738b3fc4415e4817
    weights:
      r2_prefix: models/vllm-sr/d3-nano/462efc366229ea268cf4eed3738b3fc4415e4817/
    env:
      r2_key: envs/d3-nano/cu128-py312-torch280-ada.tar.gz
      manifest_key: envs/d3-nano/cu128-py312-torch280-ada.json
      sha256: 2dedddfb052aaa0384403af0d997d04fdc7cdeaadaac338c116c6079f31ec0fd
      size: 4669093127                       # 4.67 GB conda-pack tarball
      unpack_to: /opt/env/d3-nano
      activate_rel: bin/activate
      build:
        flash_attn: true                     # DeltaNet needs causal-conv1d (built in this step)
      compat:
        python: "3.12"
        cuda: "12.8"
        torch: "2.8.0"
        gpu_family: ada

  qwen8b:
    repo: Qwen/Qwen3-VL-8B-Instruct
    revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    weights:
      r2_prefix: models/Qwen/Qwen3-VL-8B-Instruct/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b/
    env:
      r2_key: envs/qwen8b/cu128-py312-torch280-ada.tar.gz
      manifest_key: envs/qwen8b/cu128-py312-torch280-ada.json
      sha256: d101d333fe942887aefb29a4ff98eb1e0fcaaa0ea5e5f57ac1baeb53818c72ff
      size: 4666450073                       # 4.67 GB conda-pack tarball
      unpack_to: /opt/env/qwen8b
      activate_rel: bin/activate
      build:
        flash_attn: true                     # Qwen3-VL uses flash_attention_2
      compat:
        python: "3.12"
        cuda: "12.8"
        torch: "2.8.0"
        gpu_family: ada

  qwen8b-vllm:
    repo: Qwen/Qwen3-VL-8B-Instruct
    revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    weights:
      r2_prefix: models/Qwen/Qwen3-VL-8B-Instruct/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b/
    env:
      # Recorded gap for this active pin, not a new artifact: #98 records this
      # cu128 object as missing typing_extensions in the prefix. The ada2 pack
      # and its exam do not validate this identity. Producer provenance,
      # full-archive readback and isolated restore/import evidence are still
      # outstanding. Do not overwrite the object.
      r2_key: envs/qwen8b-vllm/cu128-py312-vllm0310-ada.tar.gz
      manifest_key: envs/qwen8b-vllm/cu128-py312-vllm0310-ada.json
      sha256: 2a3dcb1fc6a8d84439263512c65dae0bb576c50d4f559ae9f069407eb2e86db6
      size: 4236991211                       # 4.24 GB conda-pack tarball
      unpack_to: /opt/env/qwen8b-vllm
      activate_rel: bin/activate
      build:
        flash_attn: false                    # vLLM wheel ships attention kernels
        install_default_torch: false         # let vllm==0.31.0 pull torch 2.13.x
        require_cuda: false                  # pack CUDA wheels on a CPU VM; GPU only restores
      compat:
        python: "3.12"
        cuda: "12.8"
        torch: "2.13.0"                      # vLLM 0.31.0 in-repo lock; attested at build
        gpu_family: ada
        vllm: "0.31.0"
